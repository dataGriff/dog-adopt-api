name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Apply migrations and deploy the worker
    runs-on: ubuntu-latest
    # Skips silently until the secret is configured in the repository settings.
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install @dogadopt/contracts over HTTPS
        # pnpm clones dog-adopt-spec over git and may pick an SSH URL, which
        # runners cannot use. Every GitHub URL form is rewritten to HTTPS with
        # a token. dog-adopt-spec is public, so GITHUB_TOKEN is enough; set the
        # CONTRACTS_READ_TOKEN secret (a PAT with Contents: read on the spec
        # repo) only if it is ever made private again.
        env:
          TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for from in "https://github.com/" "git@github.com:" "ssh://git@github.com/"; do
            git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "$from"
          done
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: d1 migrations apply dogadopt --remote
      - name: Apply reference data (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: d1 execute dogadopt --remote --file=seed/reference-data.sql
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
